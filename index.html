<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petri Net Modeler</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="toolbar">
    <div class="group" role="group" aria-label="Mode">
      <button type="button" data-mode="edit">Edit</button>
      <button type="button" data-mode="play">Play</button>
    </div>
    <div class="group play-only" role="group" aria-label="Play">
      <button type="button" id="reset" title="Back to the initial marking">Reset</button>
    </div>
    <div class="group edit-only" role="group" aria-label="Tools">
      <button type="button" data-tool="select">Select</button>
      <button type="button" data-tool="place">Place</button>
      <button type="button" data-tool="transition">Transition</button>
      <button type="button" data-tool="arc">Arc</button>
    </div>
    <div class="group edit-only" role="group" aria-label="Edit">
      <button type="button" id="delete" title="Delete selection (Delete or Backspace)">Delete</button>
    </div>
    <div class="group" role="group" aria-label="File">
      <button type="button" id="export" title="Download the net as petrinet.json">Export</button>
      <button type="button" id="import" title="Open a petrinet.json file">Import</button>
      <input type="file" id="import-file" accept=".json,application/json" hidden>
    </div>
    <div class="group" role="group" aria-label="View">
      <button type="button" id="zoom-in" title="Zoom in">+</button>
      <button type="button" id="zoom-out" title="Zoom out">−</button>
      <button type="button" id="fit" title="Fit the net to the screen">Fit</button>
    </div>
    <div class="group edit-only" id="properties" role="group" aria-label="Properties" hidden>
      <label>Label <input type="text" id="prop-label" size="12"></label>
      <label id="prop-tokens-field">Tokens <input type="number" id="prop-tokens" min="0" step="1"></label>
    </div>
  </header>
  <svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg>
  <footer id="status" role="status" aria-live="polite"></footer>
  <script src="petri.js"></script>
  <script src="ui.js"></script>
</body>
</html>
